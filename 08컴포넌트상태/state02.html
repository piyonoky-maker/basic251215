<!DOCTYPE html>
<html lang="en">
<!--
키보드 입력할 때마다 입력된 문자여을 keyword ustState훅 (Hook)에서
localStorage에 저장되어 있는 kwyword값을 일겅와서 반화하도록 처리해보기
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컴포넌트상태1-2</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><!-- useState, useEffect 상태관리 -->
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><!-- render, createRoot -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <id id="root"></id>
  <script type="text/babel">
    const root = document.querySelector('#root');
    /*
    컴포넌트는 함수, 함수안에 함수를 선언 가능, 변수더 선언할 수 있다
    */
    const App = () => {
      console.log(1);
      const storage = window.localStorage;
      const [keyword, setKeyword] = React.useState(() => {
        console.log('initalize')
        //return window.localStorage.getItem('keyword');
        return storage.getItem('keyword');
      });
      const [result, setResult] = React.useState('');   //검색결과
      const [typing, setTying] = React.useState(false);   //키보드 입력상태
      //windows.localStorage;
      

      //사용자가 입력한 값 읽어 오기
      const handleChange = (event) => {
        console.log(event.target.value);
        window.localStorage.setItem('keyword', event.target.value);
        storage.setItem('keyword', event.target.value);
        //setKeyword(event.target.value);
      }
      const handleClick = () => {
        console.log('handleClick');
      };
      

      React.useEffect(() => {
        console.log('effect');
      }, []);

      return (
        <>
          <input type="text" onChange={handleChange} value={keyword}/>
          <button type="button" onClick={handleClick}>search</button>
        </>
      )
    }
    ReactDOM.createRoot(root).render(<App />);
  </script>
</body>
</html>
